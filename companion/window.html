<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AID Companion</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101214;color:#f5f7f8}*{box-sizing:border-box}body{min-height:100vh;margin:0;overflow:auto;background:radial-gradient(circle at 88% 0,#173450 0,transparent 31%),#101214}.shell{max-width:760px;margin:auto;padding:30px 34px 24px}.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #30363b;padding-bottom:22px}.brand{display:flex;align-items:center;gap:14px}.brand-icon{width:46px;height:46px;border-radius:13px;box-shadow:0 14px 34px rgba(0,0,0,.35)}.eyebrow{color:#62b4ff;font:600 10px ui-monospace;letter-spacing:.14em;text-transform:uppercase}.title{font-size:27px;line-height:1.1;margin:7px 0 5px}.muted{color:#98a1a8;font-size:12.5px;line-height:1.6}.status{display:flex;align-items:center;gap:8px;border:1px solid #33404a;border-radius:999px;padding:8px 12px;font:11px ui-monospace;color:#b7c0c7;background:rgba(12,18,23,.48)}.dot{width:8px;height:8px;border-radius:50%;background:#f0b75f}.dot.ok{background:#55d6c2;box-shadow:0 0 12px #55d6c2}.card{margin-top:16px;border:1px solid #30363b;border-radius:14px;background:rgba(23,26,29,.92);padding:18px 20px;box-shadow:0 18px 50px -40px #000}.card h2{margin:0 0 5px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 110px 110px;gap:9px;margin-top:13px}.input{width:100%;border:1px solid #343b41;border-radius:9px;background:#101214;color:#fff;padding:10px 12px;outline:none}.input:focus{border-color:#4da3ff;box-shadow:0 0 0 3px rgba(77,163,255,.09)}.password{grid-column:1/4}.button{border:1px solid #40505d;border-radius:9px;background:#22282d;color:#fff;padding:10px 14px;font-weight:600;cursor:pointer}.button:hover{border-color:#4da3ff}.button.primary{width:100%;margin-top:9px;background:linear-gradient(180deg,#329bf2,#2388e5);border-color:#329bf2;box-shadow:0 12px 30px -20px #4da3ff}.button.primary:disabled{opacity:.5;cursor:wait}.advanced{margin-top:6px;border-top:1px solid #2c3237;padding-top:10px}.advanced summary{cursor:pointer;color:#859099;font-size:11px;list-style:none}.advanced summary::-webkit-details-marker{display:none}.advanced summary:after{content:'＋';float:right;color:#68737b}.advanced[open] summary:after{content:'－'}.key{margin-top:10px;padding:11px;border:1px solid #30363b;border-radius:9px;background:#0d0f11;color:#9ba5ac;font:10.5px/1.5 ui-monospace;word-break:break-all}.actions{display:flex;gap:10px;margin-top:13px}.actions .button{flex:1}.message{min-height:20px;margin:8px 0 0;font-size:12px;color:#9ba5ac}.message.ok{color:#55d6c2}.message.error{color:#ff8b9c}.toggle{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid #30363b;font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.link{border:0;background:none;color:#7dbbff;cursor:pointer}.quit{color:#7f8990}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.step{border:1px solid #30363b;border-radius:10px;padding:12px;color:#aab2b8;font-size:11.5px;line-height:1.5}.step b{display:block;color:#fff;margin-bottom:3px}.number{color:#62b4ff;font:10px ui-monospace}@media(max-width:650px){.shell{padding:22px}.grid{grid-template-columns:1fr 90px}.grid>*:nth-child(3){grid-column:1/3}.password{grid-column:1/3}.steps{grid-template-columns:1fr}.brand-icon{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><div class="brand"><img class="brand-icon" src="icon.png" alt="AID"><div><div class="eyebrow">Local secure gateway</div><h1 class="title">AID Companion</h1><div class="muted">安全连接这台电脑与仙宫云</div></div></div><div class="status"><span id="dot" class="dot"></span><span id="status">正在启动</span></div></div>
    <section class="card"><h2>首次连接仙宫云</h2><div class="muted">输入一次仙宫云 SSH 密码，自动授权这台电脑。密码仅用于当前连接，不会保存。</div><div class="grid"><input id="host" class="input" value="me21gb3rds8p0h44.ssh.x-gpu.com" placeholder="SSH Host"><input id="port" class="input" value="43213" placeholder="Port"><input id="user" class="input" value="root" placeholder="User"><input id="password" class="input password" type="password" placeholder="仙宫云 SSH 密码"></div><button id="authorize" class="button primary">一键授权这台电脑</button><p id="message" class="message"></p><details class="advanced"><summary>高级信息 · 本机专属公钥</summary><div id="key" class="key">正在生成本机公钥…</div><button id="copy" class="button" style="margin-top:9px">复制公钥</button></details></section>
    <section class="card"><h2>开始使用</h2><div class="steps"><div class="step"><span class="number">01</span><b>保持 Companion 运行</b>关闭窗口后仍驻留在系统托盘。</div><div class="step"><span class="number">02</span><b>打开 AID 网站</b>设置中保持 Local Companion 开启。</div><div class="step"><span class="number">03</span><b>测试连接</b>仙宫云重建后重新执行一次授权。</div></div><div class="actions"><button id="website" class="button">打开 pandais.beauty</button></div><label class="toggle"><span>登录电脑时自动启动</span><input id="login" type="checkbox"></label></section>
    <div class="footer"><span id="version" class="muted"></span><button id="quit" class="link quit">退出 Companion</button></div>
  </main>
  <script>
    const $=id=>document.getElementById(id);let state;
    async function check(){try{const response=await fetch('http://127.0.0.1:3018/api/companion/status');if(!response.ok)throw 0;const result=await response.json();if(result.version!==state.version){$('dot').classList.remove('ok');$('status').textContent='端口被占用';$('message').className='message error';$('message').textContent='3018 端口已被旧版 Companion 或开发服务占用，请先退出它后重新打开本程序。';return}$('dot').classList.add('ok');$('status').textContent='运行中'}catch{$('dot').classList.remove('ok');$('status').textContent='正在启动';setTimeout(check,1200)}}
    (async()=>{state=await window.aidCompanion.getState();$('key').textContent=state.publicKey;$('login').checked=state.launchAtLogin;$('version').textContent=`v${state.version} · ${state.serviceUrl}`;check()})();
    $('copy').onclick=async()=>{await window.aidCompanion.copyText(state.publicKey);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制公钥',1500)};
    $('authorize').onclick=async()=>{const button=$('authorize'),message=$('message');button.disabled=true;button.textContent='正在授权…';message.className='message';message.textContent='正在连接仙宫云';try{await window.aidCompanion.authorize({host:$('host').value,port:$('port').value,user:$('user').value,password:$('password').value});message.className='message ok';message.textContent='授权成功，可以打开 AID 测试连接了';$('password').value=''}catch(error){message.className='message error';message.textContent=error.message||String(error)}finally{button.disabled=false;button.textContent='一键授权这台电脑'}};
    $('website').onclick=()=>window.aidCompanion.openWebsite();$('login').onchange=()=>window.aidCompanion.setLaunchAtLogin($('login').checked);$('quit').onclick=()=>window.aidCompanion.quit();
  </script>
</body>
</html>
